<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Point Cloud Viewer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            width: 220px;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
        }
        button:hover { background: #45a049; }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        select:hover { background: #444; }
        input[type="file"] { color: white; }

        /* Search bar styles */
        #searchContainer {
            margin-top: 12px;
        }
        #searchContainer label {
            font-weight: bold;
            font-size: 13px;
        }
        #searchWrapper {
            position: relative;
            margin-top: 6px;
        }
        #searchInput {
            width: 100%;
            padding: 8px 30px 8px 10px;
            background: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        #searchInput:focus {
            border-color: #4CAF50;
        }
        #clearSearch {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            margin: 0;
            line-height: 1;
            display: none;
        }
        #clearSearch:hover { color: white; background: none; }

        #searchResults {
            margin-top: 6px;
            max-height: 130px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 12px;
        }
        .search-result-item {
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255,255,255,0.05);
            margin-bottom: 2px;
            transition: background 0.15s;
        }
        .search-result-item:hover {
            background: rgba(76, 175, 80, 0.3);
        }
        .search-result-item.active {
            background: rgba(76, 175, 80, 0.5);
            border-left: 3px solid #4CAF50;
            padding-left: 5px;
        }
        #searchNav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 12px;
            color: #aaa;
        }
        #searchNav button {
            padding: 3px 9px;
            font-size: 12px;
            margin: 0;
            background: #333;
        }
        #searchNav button:hover { background: #555; }
        #searchCount { flex: 1; text-align: center; }

        #searchNoResults {
            font-size: 12px;
            color: #f77;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <div>
            <label for="methodSelect"><strong>Visualization Method:</strong></label><br>
            <select id="methodSelect">
                <option value="umap">UMAP</option>
                <option value="pca">PCA</option>
                <option value="tsne">t-SNE</option>
            </select>
        </div>

        <!-- Search Bar -->
        <div id="searchContainer">
            <label>Search Artist:</label>
            <div id="searchWrapper">
                <input type="text" id="searchInput" placeholder="Type an artist name…" autocomplete="off" />
                <button id="clearSearch" title="Clear">✕</button>
            </div>
            <div id="searchNoResults">No matches found</div>
            <div id="searchResults"></div>
            <div id="searchNav" style="display:none;">
                <button id="prevResult">&#8593;</button>
                <span id="searchCount"></span>
                <button id="nextResult">&#8595;</button>
            </div>
        </div>

        <div id="status" style="margin-top: 10px;">Loading data...</div>
        <div style="margin-top: 10px; font-size: 12px;">
            <strong>Controls:</strong><br>
            Left Click + Drag: Rotate<br>
            Right Click + Drag: Pan<br>
            Scroll: Zoom<br>
            Click Point: Show Info
        </div>
    </div>
    <div id="info"></div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, points, pointsData = [];
        let raycaster, mouse;
        let originalColors = [];
        let searchMatches = [];
        let currentMatchIndex = -1;

        // ─── Three.js Init ────────────────────────────────────────────────────────

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            raycaster.params.Points.threshold = 0.1;
            mouse = new THREE.Vector2();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 0.4);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            // Mouse controls
            let isDragging = false;
            let isPanning = false;
            let previousMousePosition = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', (e) => {
                if (e.button === 0) isDragging = true;
                else if (e.button === 2) isPanning = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = e.clientX - previousMousePosition.x;
                    const dy = e.clientY - previousMousePosition.y;
                    if (points) {
                        points.rotation.y += dx * 0.01;
                        points.rotation.x += dy * 0.01;
                    }
                } else if (isPanning) {
                    const dx = e.clientX - previousMousePosition.x;
                    const dy = e.clientY - previousMousePosition.y;
                    camera.position.x -= dx * 0.01;
                    camera.position.y += dy * 0.01;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            renderer.domElement.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
            renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(1, Math.min(50, camera.position.z));
            });
            renderer.domElement.addEventListener('click', onPointClick);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        // ─── Point Cloud ──────────────────────────────────────────────────────────

        function loadPointCloud(data) {
            if (points) scene.remove(points);
            clearSearch();

            pointsData = data;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            const scores = data.map(p => p.score);
            const minScore = Math.min(...scores);
            const maxScore = Math.max(...scores);

            data.forEach(point => {
                positions.push(point.x, point.y, point.z);
                const normalized = (point.score - minScore) / (maxScore - minScore);
                const color = new THREE.Color();
                color.setHSL(0.6 - normalized * 0.6, 1, 0.5);
                colors.push(color.r, color.g, color.b);
            });

            // Store original colors
            originalColors = [...colors];

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 0.1, vertexColors: true });
            points = new THREE.Points(geometry, material);
            scene.add(points);

            geometry.computeBoundingSphere();
            const center = geometry.boundingSphere.center;
            const radius = geometry.boundingSphere.radius;
            camera.position.set(center.x, center.y, center.z + radius * 2);
            camera.lookAt(center);
        }

        // ─── Click Info ───────────────────────────────────────────────────────────

        function onPointClick(event) {
            if (!points) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(points);
            if (intersects.length > 0) {
                const idx = intersects[0].index;
                const point = pointsData[idx];
                const infoDiv = document.getElementById('info');
                infoDiv.innerHTML = `
                    <strong>Point Information:</strong><br>
                    Name: ${point.name}<br>
                    X: ${point.x.toFixed(3)}<br>
                    Y: ${point.y.toFixed(3)}<br>
                    Z: ${point.z.toFixed(3)}<br>
                    Score: ${point.score.toFixed(3)}
                `;
                infoDiv.style.display = 'block';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // ─── Color Helpers ────────────────────────────────────────────────────────

        function applyHighlights(matchIndices) {
            if (!points) return;
            const colorAttr = points.geometry.attributes.color;
            const arr = colorAttr.array;

            // Reset all to original (dimmed)
            for (let i = 0; i < pointsData.length; i++) {
                if (matchIndices.length > 0) {
                    // dim non-matches
                    arr[i * 3]     = originalColors[i * 3] * 0.2;
                    arr[i * 3 + 1] = originalColors[i * 3 + 1] * 0.2;
                    arr[i * 3 + 2] = originalColors[i * 3 + 2] * 0.2;
                } else {
                    arr[i * 3]     = originalColors[i * 3];
                    arr[i * 3 + 1] = originalColors[i * 3 + 1];
                    arr[i * 3 + 2] = originalColors[i * 3 + 2];
                }
            }

            // Highlight matches in bright yellow
            matchIndices.forEach((idx, mi) => {
                const isCurrent = mi === currentMatchIndex;
                if (isCurrent) {
                    arr[idx * 3]     = 1.0;
                    arr[idx * 3 + 1] = 1.0;
                    arr[idx * 3 + 2] = 0.0;
                } else {
                    arr[idx * 3]     = 1.0;
                    arr[idx * 3 + 1] = 0.65;
                    arr[idx * 3 + 2] = 0.0;
                }
            });

            colorAttr.needsUpdate = true;

            // Update point size to make matches pop
            points.material.size = matchIndices.length > 0 ? 0.08 : 0.1;
        }

        function flyToPoint(idx) {
            if (!points || !pointsData[idx]) return;
            const p = pointsData[idx];

            // Transform world position through points rotation
            const localPos = new THREE.Vector3(p.x, p.y, p.z);
            localPos.applyEuler(points.rotation);

            camera.position.x = localPos.x;
            camera.position.y = localPos.y;
            camera.position.z = localPos.z + 3;
            camera.lookAt(localPos);
        }

        // ─── Search Logic ─────────────────────────────────────────────────────────

        function doSearch(query) {
            const resultsDiv = document.getElementById('searchResults');
            const navDiv = document.getElementById('searchNav');
            const noResultsDiv = document.getElementById('searchNoResults');
            const countSpan = document.getElementById('searchCount');

            if (!query.trim() || pointsData.length === 0) {
                searchMatches = [];
                currentMatchIndex = -1;
                resultsDiv.innerHTML = '';
                navDiv.style.display = 'none';
                noResultsDiv.style.display = 'none';
                applyHighlights([]);
                return;
            }

            const q = query.toLowerCase();
            searchMatches = pointsData
                .map((p, i) => ({ idx: i, name: p.name }))
                .filter(p => p.name && p.name.toLowerCase().includes(q));

            resultsDiv.innerHTML = '';

            if (searchMatches.length === 0) {
                noResultsDiv.style.display = 'block';
                navDiv.style.display = 'none';
                applyHighlights([]);
                currentMatchIndex = -1;
                return;
            }

            noResultsDiv.style.display = 'none';

            searchMatches.forEach((match, mi) => {
                const item = document.createElement('div');
                item.className = 'search-result-item' + (mi === 0 ? ' active' : '');
                item.textContent = match.name;
                item.title = match.name;
                item.addEventListener('click', () => selectMatch(mi));
                resultsDiv.appendChild(item);
            });

            // Auto-select first
            currentMatchIndex = 0;
            updateNavUI();
            applyHighlights(searchMatches.map(m => m.idx));
            flyToPoint(searchMatches[0].idx);
        }

        function selectMatch(mi) {
            currentMatchIndex = mi;
            updateNavUI();
            applyHighlights(searchMatches.map(m => m.idx));
            flyToPoint(searchMatches[mi].idx);

            // Update active style
            const items = document.querySelectorAll('.search-result-item');
            items.forEach((el, i) => {
                el.classList.toggle('active', i === mi);
            });
            // Scroll item into view
            if (items[mi]) items[mi].scrollIntoView({ block: 'nearest' });

            // Show info panel
            if (points) {
                const point = pointsData[searchMatches[mi].idx];
                const infoDiv = document.getElementById('info');
                infoDiv.innerHTML = `
                    <strong>Point Information:</strong><br>
                    Name: ${point.name}<br>
                    X: ${point.x.toFixed(3)}<br>
                    Y: ${point.y.toFixed(3)}<br>
                    Z: ${point.z.toFixed(3)}<br>
                    Score: ${point.score.toFixed(3)}
                `;
                infoDiv.style.display = 'block';
            }
        }

        function updateNavUI() {
            const navDiv = document.getElementById('searchNav');
            const countSpan = document.getElementById('searchCount');
            if (searchMatches.length > 1) {
                navDiv.style.display = 'flex';
                countSpan.textContent = `${currentMatchIndex + 1} / ${searchMatches.length}`;
            } else {
                navDiv.style.display = 'none';
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').style.display = 'none';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchNav').style.display = 'none';
            document.getElementById('searchNoResults').style.display = 'none';
            searchMatches = [];
            currentMatchIndex = -1;
            applyHighlights([]);
        }

        // Search input events
        let searchDebounce;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('clearSearch').style.display = val ? 'block' : 'none';
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => doSearch(val), 200);
        });

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (searchMatches.length > 0) {
                    const next = (currentMatchIndex + 1) % searchMatches.length;
                    selectMatch(next);
                }
            } else if (e.key === 'Escape') {
                clearSearch();
            }
        });

        document.getElementById('clearSearch').addEventListener('click', clearSearch);

        document.getElementById('nextResult').addEventListener('click', () => {
            if (searchMatches.length > 0) {
                selectMatch((currentMatchIndex + 1) % searchMatches.length);
            }
        });
        document.getElementById('prevResult').addEventListener('click', () => {
            if (searchMatches.length > 0) {
                selectMatch((currentMatchIndex - 1 + searchMatches.length) % searchMatches.length);
            }
        });

        // ─── Data Loading ─────────────────────────────────────────────────────────

        init();

        async function loadDataFromFile(method) {
            const statusDiv = document.getElementById('status');
            const filename = `/${method}.json`;
            try {
                statusDiv.textContent = `Loading ${method.toUpperCase()} data...`;
                const response = await fetch(filename);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                loadPointCloud(data['nodes']);
                statusDiv.textContent = `Loaded ${data['nodes'].length} points (${method.toUpperCase()})`;
            } catch (error) {
                statusDiv.textContent = `Error loading ${filename}: ${error.message}`;
                console.error('Error loading point cloud data:', error);

                const exampleData = [
                    {name: "Radiohead", x: 0, y: 0, z: 0, score: 0.5},
                    {name: "Radiohead B-Sides", x: 0.1, y: 0.1, z: 0.1, score: 0.45},
                    {name: "Björk", x: 1, y: 1, z: 1, score: 0.8},
                    {name: "Portishead", x: -1, y: 1, z: -1, score: 0.3},
                    {name: "Massive Attack", x: 2, y: -1, z: 0, score: 0.9},
                    {name: "Boards of Canada", x: -2, y: 0, z: 1, score: 0.2},
                    {name: "Aphex Twin", x: 0.5, y: -1.5, z: 0.8, score: 0.6},
                    {name: "Burial", x: -1.2, y: 0.3, z: -0.5, score: 0.4},
                    {name: "Flying Lotus", x: 1.8, y: 0.5, z: -1.2, score: 0.7},
                    {name: "Arca", x: -0.8, y: -1, z: 1.5, score: 0.55},
                ];
                loadPointCloud(exampleData);
                statusDiv.textContent += ' (Using example data)';
            }
        }

        document.getElementById('methodSelect').addEventListener('change', (e) => {
            loadDataFromFile(e.target.value);
        });

        loadDataFromFile('umap');
    </script>
</body>
</html>
