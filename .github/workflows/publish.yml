# File: .github/workflows/publish.yml
name: publish-to-github-pages
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
       
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          
      - name: Install dependencies 🔧
        run: npm ci
       
      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
         
      - name: Debug environment 🔍
        run: |
          echo "=== Environment Debug ==="
          echo "Current directory: $(pwd)"
          echo "Contents of current directory:"
          ls -la
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Checking for package.json:"
          cat package.json | head -10
          echo "Checking for next.config.ts:"
          ls -la next.config.*
          cat next.config.ts
         
      - name: Build with Next.js 🏗️
        run: |
          echo "=== Starting Build Process ==="
          echo "Pre-build directory contents:"
          ls -la
          echo "Running: npm run build"
          npm run build
          echo "=== Post-build Analysis ==="
          echo "Root directory after build:"
          ls -la
          echo "Checking for out directory:"
          if [ -d "out" ]; then
            echo "✅ out directory EXISTS"
            echo "Contents of out directory:"
            ls -la out/
            echo "File count in out: $(find out -type f | wc -l)"
          else
            echo "❌ out directory MISSING"
            echo "Checking for .next directory:"
            if [ -d ".next" ]; then
              echo "Found .next directory instead:"
              ls -la .next/
            else
              echo "Neither out nor .next directory found!"
            fi
            echo "=== DEBUGGING: All directories in current path ==="
            find . -maxdepth 2 -type d
            exit 1
          fi
         
      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
             
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4