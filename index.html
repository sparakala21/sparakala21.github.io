<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Point Cloud Viewer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #fileInput {
            margin-bottom: 10px;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
        }
        button:hover {
            background: #45a049;
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            width: 150px;
            font-size: 14px;
        }
        select:hover {
            background: #444;
        }
        input[type="file"] {
            color: white;
        }
    </style>
</head>
<body>
    <div id="controls">
        <div>
            <label for="methodSelect"><strong>Visualization Method:</strong></label><br>
            <select id="methodSelect">
                <option value="pca">PCA</option>
                <option value="umap">UMAP</option>
                <option value="tsne">t-SNE</option>
            </select>
        </div>
        <div id="status" style="margin-top: 10px;">Loading data...</div>
        <div style="margin-top: 10px; font-size: 12px;">
            <strong>Controls:</strong><br>
            Left Click + Drag: Rotate<br>
            Right Click + Drag: Pan<br>
            Scroll: Zoom<br>
            Click Point: Show Info
        </div>
    </div>
    <div id="info"></div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, points, pointsData = [];
        let raycaster, mouse;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Raycaster for clicking
            raycaster = new THREE.Raycaster();
            raycaster.params.Points.threshold = 0.1;
            mouse = new THREE.Vector2();

            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 0.4);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Add grid helper
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            // Mouse controls
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let isPanning = false;

            renderer.domElement.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    isDragging = true;
                } else if (e.button === 2) {
                    isPanning = true;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    if (points) {
                        points.rotation.y += deltaX * 0.01;
                        points.rotation.x += deltaY * 0.01;
                    }
                } else if (isPanning) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    camera.position.x -= deltaX * 0.01;
                    camera.position.y += deltaY * 0.01;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
                isPanning = false;
            });

            renderer.domElement.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });

            // Zoom
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(1, Math.min(50, camera.position.z));
            });

            // Click detection
            renderer.domElement.addEventListener('click', onPointClick);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function loadPointCloud(data) {
            if (points) {
                scene.remove(points);
            }

            pointsData = data;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            const scores = data.map(p => p.score);
            const minScore = Math.min(...scores);
            const maxScore = Math.max(...scores);

            data.forEach(point => {
                positions.push(point.x, point.y, point.z);
                
                const normalized = (point.score - minScore) / (maxScore - minScore);
                const color = new THREE.Color();
                color.setHSL(0.6 - normalized * 0.6, 1, 0.5);
                colors.push(color.r, color.g, color.b);
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);

            geometry.computeBoundingSphere();
            const center = geometry.boundingSphere.center;
            const radius = geometry.boundingSphere.radius;
            camera.position.set(center.x, center.y, center.z + radius * 2);
            camera.lookAt(center);
        }

        function onPointClick(event) {
            if (!points) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(points);

            if (intersects.length > 0) {
                const index = intersects[0].index;
                const point = pointsData[index];
                
                const infoDiv = document.getElementById('info');
                infoDiv.innerHTML = `
                    <strong>Point Information:</strong><br>
                    Name: ${point.name}<br>
                    X: ${point.x.toFixed(3)}<br>
                    Y: ${point.y.toFixed(3)}<br>
                    Z: ${point.z.toFixed(3)}<br>
                    Score: ${point.score.toFixed(3)}
                `;
                infoDiv.style.display = 'block';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        init();

        async function loadDataFromFile(method) {
            const statusDiv = document.getElementById('status');
            const filename = `/${method}.json`;
            try {
                statusDiv.textContent = `Loading ${method.toUpperCase()} data...`;
                const response = await fetch(filename);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                loadPointCloud(data['nodes']);
                statusDiv.textContent = `Loaded ${data['nodes'].length} points (${method.toUpperCase()})`;
            } catch (error) {
                statusDiv.textContent = `Error loading ${filename}: ${error.message}`;
                console.error('Error loading point cloud data:', error);
                
                const exampleData = [
                    {name: "Point 1", x: 0, y: 0, z: 0, score: 0.5},
                    {name: "Point 2", x: 1, y: 1, z: 1, score: 0.8},
                    {name: "Point 3", x: -1, y: 1, z: -1, score: 0.3},
                    {name: "Point 4", x: 2, y: -1, z: 0, score: 0.9},
                    {name: "Point 5", x: -2, y: 0, z: 1, score: 0.2},
                    {name: "Point 6", x: 0.5, y: -1.5, z: 0.8, score: 0.6},
                    {name: "Point 7", x: -1.2, y: 0.3, z: -0.5, score: 0.4}
                ];
                loadPointCloud(exampleData);
                statusDiv.textContent += ' (Using example data)';
            }
        }
        
        // Handle dropdown change
        document.getElementById('methodSelect').addEventListener('change', (event) => {
            const selectedMethod = event.target.value;
            loadDataFromFile(selectedMethod);
        });
        
        // Load initial data (PCA by default)
        loadDataFromFile('pca');
    </script>
</body>
</html>
